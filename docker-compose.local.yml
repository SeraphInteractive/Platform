services:
  api:
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:${PORT:-3333}:3333"

  postgres:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - backend
      - edge

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - backend
      - edge
