name: stairway-test-vps

services:
  nextcloud:
    image: nextcloud:30-apache
    container_name: stairway-test-vps
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    environment:
      - NEXTCLOUD_ADMIN_USER=stairway_test
      - NEXTCLOUD_ADMIN_PASSWORD=stairway_test_password_123
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 test-vps
      - SQLITE_DATABASE=nextcloud
    volumes:
      - test_vps_nextcloud_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/status.php || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  test_vps_nextcloud_data:
